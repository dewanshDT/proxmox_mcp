services:
  proxmox-mcp:
    build: .
    image: proxmox-mcp
    container_name: proxmox-mcp
    restart: unless-stopped
    # Maps host:container. Set MCP_HOST_PORT in .env to expose a different LAN
    # port — note that a compose *override* file cannot change this, because
    # Compose appends port lists rather than replacing them.
    ports:
      - "${MCP_HOST_PORT:-3000}:3000"
    # All configuration lives in .env (copy from .env.example).
    env_file:
      - .env
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.MCP_HTTP_PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
