name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Smoke test the server
        env:
          MCP_AUTH_TOKEN: ci-test-token
          MCP_HTTP_PORT: "3999"
          PROXMOX_HOST: 192.0.2.1
          PROXMOX_TOKEN_ID: "ci@pve!test"
          PROXMOX_TOKEN_SECRET: dummy
        run: |
          node dist/index.js &
          SRV=$!
          sleep 2

          echo "-> /health should be 200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/health)" = "200"

          echo "-> unauthenticated POST /mcp should be 401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3999/mcp \
            -H 'Content-Type: application/json' -d '{}')" = "401"

          echo "-> GET /mcp should be 405"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/mcp \
            -H 'Authorization: Bearer ci-test-token')" = "405"

          echo "-> authenticated tools/list should return every tool"
          COUNT=$(curl -s -X POST http://127.0.0.1:3999/mcp \
            -H 'Authorization: Bearer ci-test-token' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | sed 's/^data: //' | grep -o '"name":"proxmox_[a-z_]*"' | sort -u | wc -l | tr -d ' ')
          echo "   found $COUNT tools"
          test "$COUNT" = "26"

          kill $SRV

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: proxmox-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container starts and answers /health
        run: |
          docker run -d --name mcp-ci -p 3000:3000 \
            -e MCP_AUTH_TOKEN=ci-test-token \
            -e PROXMOX_HOST=192.0.2.1 \
            -e PROXMOX_TOKEN_ID='ci@pve!test' \
            -e PROXMOX_TOKEN_SECRET=dummy \
            proxmox-mcp:ci

          # Poll rather than sleeping a fixed amount: a slow runner used to lose
          # the race and fail with "Recv failure: Connection reset by peer".
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo "   healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container did not answer /health within 30s"
          exit 1

      # Runs even when the step above fails — previously `bash -e` aborted first,
      # so the one failure we did get arrived with no logs to diagnose it.
      - name: Container logs
        if: always()
        run: docker logs mcp-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f mcp-ci || true
